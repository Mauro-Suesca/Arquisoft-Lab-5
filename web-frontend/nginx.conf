# Web Frontend server configuration.
# Copied into the image as /etc/nginx/conf.d/default.conf (see Dockerfile).
#
# Responsibilities:
#   1. Serve the React (Vite) static build.
#   2. Act as the connector between the Web Frontend and the CPS Calculator:
#      requests to /api/... are forwarded to the backend service over the
#      internal Docker network, with the "/api" prefix removed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Resolving the backend at request time
    # (instead of at start-up) lets this container start even when the
    # backend is not running yet, and picks up a new backend IP after the
    # backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # CPS Calculator API: /api/<path> -> http://backend:8000/<path>
    location /api/ {
        set $cps_calculator http://backend:8000;

        # Strip the "/api" prefix; FastAPI routes are /health, /users/{name}...
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $cps_calculator;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Keep the client data received from the main reverse proxy.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # React SPA: serve existing files, fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
