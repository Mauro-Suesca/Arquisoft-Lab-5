# CPS Calculator - full stack
#
# Connector chain (C&C diagram):
#
#   Web Browser --HTTP--> nginx (reverse proxy, host :8080)
#                           --HTTP--> web-frontend (nginx: React build + /api connector)
#                                       --HTTP--> backend (FastAPI, CPS Calculator)
#                                                   --SQL--> db (PostgreSQL)
#
# Start everything with:  docker compose up --build -d
# Only the main reverse proxy (nginx) publishes a port on the host.

name: cps-calculator

services:

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cps_db}
      POSTGRES_USER: ${POSTGRES_USER:-cps_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cps_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data_net
    restart: unless-stopped
    # No "ports": reachable only by the backend through data_net.

  backend:
    build:
      context: ./cps_backend
      dockerfile: dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cps_user}:${POSTGRES_PASSWORD:-cps_password}@db:5432/${POSTGRES_DB:-cps_db}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_net
      - data_net
    restart: unless-stopped
    # No "ports": reachable only by web-frontend through app_net.

  web-frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    # No depends_on: web-frontend/nginx.conf resolves "backend" per request,
    # so the static site can start even before the API is ready.
    healthcheck:
      # busybox wget is included in nginx:alpine; 127.0.0.1 avoids IPv6 "localhost"
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - edge_net
      - app_net
    restart: unless-stopped
    # No "ports": reachable only by the main reverse proxy through edge_net.

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./etc/nginx/sites-available/localhost:/etc/nginx/conf.d/default.conf:ro
    # Required: the upstream "web-frontend" is resolved when nginx starts.
    depends_on:
      web-frontend:
        condition: service_healthy
    networks:
      - edge_net
    restart: unless-stopped

networks:
  # Reverse proxy <-> Web Frontend. Not internal: nginx publishes 8080 here.
  edge_net:
    driver: bridge
  # Web Frontend <-> CPS Calculator. Internal: no traffic to/from outside Docker.
  app_net:
    driver: bridge
    internal: true
  # CPS Calculator <-> Relational Database. Internal: no traffic to/from outside Docker.
  data_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
